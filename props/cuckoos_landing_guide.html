<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cuckoo's Landing — DM Reference (letter)</title>
<style>
  @page { size: letter; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 8.5in; height: 10.84in; margin: 0 auto; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 1470"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');

function el(name, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function txt(x, y, str, attrs = {}, parent = svg) {
  const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs), parent);
  t.textContent = str;
  return t;
}

// Same map geometry as cuckoos_landing_map.html, shown in the DEPLOYED state:
// the platform overlay in place, doors slammed open, rod extended, perch on
// the gear hub. Guide coords == print-map coords (both OX 96, OY 96, CELL 96).
// Orientation: front of tower = bottom; the cuckoo bursts toward the players.
const CELL = 96;
const COLS = 10, ROWS = 10;
const PAGE_W = 1152;
const W = COLS * CELL, H = ROWS * CELL;
const OX = (PAGE_W - W) / 2, OY = 96;
const CX = OX + W / 2, CY = OY + H / 2, R = W / 2;
const R_INNER = R - 10;
const INK = '#000';

// Platform overlay landmarks (map coords; overlay sheet coords + (48, -44))
const PTOP = 8;                       // structure slab top (trim edge)
const FACE = 144;                     // wall face — top of the catwalk half-row
const CAT1 = 192;                     // catwalk bottom = row A/B line
const CORB = 288;                     // corner block bottom = row B/C line
const PX0 = 96, PX1 = 1056;           // platform west/east edges
const WBX = 288, EBX = 864;           // corner block inner edges
const DX0 = 384, DX1 = 768;           // door aperture, cols 4-7
const RODX = 576;                     // rod centerline
const HUBX = 576, HUBY = 576;         // perch center = gear hub
const LEAF = 192;                     // 10-ft door leaf

// --- Zone geometry (in 5 ft units) ---
function inGear(col, row) {
  const cL = col * 5, cT = row * 5, cR = cL + 5, cB = cT + 5;
  const px = Math.max(cL, Math.min(25, cR));
  const py = Math.max(cT, Math.min(25, cB));
  return Math.hypot(px - 25, py - 25) <= 25;
}
function inCone(col, row) {
  if (row <= 5) return false;
  const dist = row - 5;
  if (dist > 6) return false;
  return col >= 4 - dist && col <= 5 + dist;
}
// rod corridor on the gear (rows B-D; row A is the catwalk, handled below)
function isImpact(col, row) { return ((row >= 1 && row <= 3 && col >= 4 && col <= 5) || (row === 1 && col >= 1 && col <= 8) || (row === 2 && [2, 3, 6, 7].includes(col))) && inGear(col, row); }
function isCuckoo(col, row) { return row >= 4 && row <= 5 && col >= 4 && col <= 5; }

// --- Defs: hatch patterns + grid clip ---
const defs = el('defs');
function hatchPattern(id, size, paths, strokeWidth) {
  const p = el('pattern', { id, width: size, height: size, patternUnits: 'userSpaceOnUse' }, defs);
  for (const d of paths) el('path', { d, stroke: INK, 'stroke-width': strokeWidth, fill: 'none' }, p);
}
hatchPattern('impact', 12, ['M12 0 L0 12', 'M14 10 L10 14', 'M2 -2 L-2 2'], 1.2);   // 135°
hatchPattern('cone', 12, ['M0 0 L12 12', 'M-2 10 L2 14', 'M10 -2 L14 2'], 1.2);     // 45°
hatchPattern('cuckoo', 7, ['M0 0 L7 7', 'M7 0 L0 7'], 1);                            // crosshatch
hatchPattern('wall', 7, ['M0 7 L7 0'], 0.5);                                         // tower mass
const clip = el('clipPath', { id: 'gridClip' }, defs);
el('circle', { cx: CX, cy: CY, r: R_INNER }, clip);

el('rect', { x: 0, y: 0, width: PAGE_W, height: 1470, fill: '#fff' });

// --- Gear-level zone fills + grid, clipped to the inner ring ---
const gClipped = el('g', { 'clip-path': 'url(#gridClip)' });
for (let row = 0; row < ROWS; row++) {
  for (let col = 0; col < COLS; col++) {
    if (!inGear(col, row)) continue;
    let fill = null;
    if (isCuckoo(col, row)) fill = 'url(#cuckoo)';
    else if (isImpact(col, row)) fill = 'url(#impact)';
    else if (inCone(col, row)) fill = 'url(#cone)';
    if (fill) el('rect', { x: OX + col * CELL, y: OY + row * CELL, width: CELL, height: CELL, fill }, gClipped);
  }
}
for (let i = 0; i <= COLS; i++) {
  el('line', { x1: OX + i * CELL, y1: OY, x2: OX + i * CELL, y2: OY + H, stroke: INK, 'stroke-width': 1 }, gClipped);
}
for (let i = 0; i <= ROWS; i++) {
  el('line', { x1: OX, y1: OY + i * CELL, x2: OX + W, y2: OY + i * CELL, stroke: INK, 'stroke-width': 1 }, gClipped);
}

// --- Zone boundaries (rod corridor sides; cone edges) ---
for (const c of [4, 6]) {
  el('line', { x1: OX + c * CELL, y1: CAT1, x2: OX + c * CELL, y2: OY + 4 * CELL,
    stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '14 8' }, gClipped);
}
for (const dir of [-1, 1]) {
  el('line', {
    x1: OX + (5 + dir) * CELL, y1: OY + 6 * CELL,
    x2: OX + (5 + 5 * dir) * CELL, y2: OY + 10 * CELL,
    stroke: INK, 'stroke-width': 3, 'stroke-dasharray': '14 8' }, gClipped);
}
el('rect', { x: OX + 4 * CELL, y: OY + 4 * CELL, width: 2 * CELL, height: 2 * CELL,
  fill: 'none', stroke: INK, 'stroke-width': 5 });

// --- Gear silhouette: continuous outline, identical to print map ---
const numTeeth = 32;
const stepDeg = 360 / numTeeth;
function toothPts(aDeg) {
  const a = aDeg * Math.PI / 180;
  const px = CX + Math.cos(a) * R, py = CY + Math.sin(a) * R;
  const rot = (aDeg + 90) * Math.PI / 180;
  const c = Math.cos(rot), s = Math.sin(rot);
  return [[-23.5, 0], [-15, -45], [15, -45], [23.5, 0]]
    .map(([x, y]) => [px + x * c - y * s, py + x * s + y * c].map(v => v.toFixed(2)));
}
let d = '';
for (let i = 0; i < numTeeth; i++) {
  const [bl, tl, tr, br] = toothPts(i * stepDeg);
  d += (i === 0 ? `M ${bl}` : ` A ${R} ${R} 0 0 1 ${bl}`);
  d += ` L ${tl} L ${tr} L ${br}`;
}
d += ` A ${R} ${R} 0 0 1 ${toothPts(0)[0]} Z`;
el('path', { d, fill: 'none', stroke: INK, 'stroke-width': 4 });
el('circle', { cx: CX, cy: CY, r: R_INNER, fill: 'none', stroke: INK, 'stroke-width': 1.5 });

// ============ Platform overlay, deployed state ============
// paper fill (covers the gear where the sheet lies)
const sheetPath = `M ${PX0} ${PTOP} H ${PX1} V ${CORB} H ${EBX} V ${CAT1} H ${WBX} V ${CORB} H ${PX0} Z`;
el('path', { d: sheetPath, fill: '#fff', stroke: 'none' });

// catwalk + corner grid
for (let c = 0; c <= 10; c++) {
  const x = PX0 + c * CELL;
  const yEnd = (x <= WBX || x >= EBX) ? CORB : CAT1;
  el('line', { x1: x, y1: FACE, x2: x, y2: yEnd, stroke: INK, 'stroke-width': 1 });
}
el('line', { x1: PX0, y1: CAT1, x2: PX1, y2: CAT1, stroke: INK, 'stroke-width': 1 });
el('line', { x1: PX0, y1: CORB, x2: WBX, y2: CORB, stroke: INK, 'stroke-width': 1 });
el('line', { x1: EBX, y1: CORB, x2: PX1, y2: CORB, stroke: INK, 'stroke-width': 1 });

// tower mass, split by the open doorway
for (const [x0, x1] of [[PX0, DX0], [DX1, PX1]]) {
  el('rect', { x: x0, y: PTOP, width: x1 - x0, height: FACE - PTOP, fill: 'url(#wall)', stroke: 'none' });
  el('line', { x1: x0, y1: FACE, x2: x1, y2: FACE, stroke: INK, 'stroke-width': 1.5 });
}
txt(RODX, 84, 'PLANAR DOORWAY', { fill: INK, 'font-size': 16, 'letter-spacing': 2, 'font-weight': 700 });
txt(RODX, 108, '(doors shown slammed open)', { fill: INK, 'font-size': 12 });

// doors: 10-ft leaves swung 180° flat on the wall face, hinge pins at jambs
for (const [hx, dir] of [[DX0, -1], [DX1, 1]]) {
  el('rect', { x: hx + (dir > 0 ? 0 : -LEAF), y: FACE, width: LEAF, height: 12, fill: '#fff', stroke: INK, 'stroke-width': 1.6 });
  el('circle', { cx: hx, cy: FACE, r: 3, fill: '#fff', stroke: INK, 'stroke-width': 1.3 });
}

// bold sheet outline (sides + front; open across the back — tower continues)
el('path', { d: `M ${PX0} ${PTOP} L ${PX0} ${CORB} H ${WBX} V ${CAT1} H ${EBX} V ${CORB} H ${PX1} L ${PX1} ${PTOP}`,
  fill: 'none', stroke: INK, 'stroke-width': 3 });

// hatch up from the Bellows Chamber (B2) + riser (B1) + A1 wall entry
const hx0 = 200, hy0 = 200, hs = 80;
el('rect', { x: hx0, y: hy0, width: hs, height: hs, fill: '#fff', stroke: INK, 'stroke-width': 2 });
for (let i = 1; i <= 4; i++) {
  el('line', { x1: hx0 + 10, y1: hy0 + i * (hs / 5), x2: hx0 + hs - 10, y2: hy0 + i * (hs / 5), stroke: INK, 'stroke-width': 1.2 });
}
txt(hx0 + hs / 2, hy0 + hs + 16, 'hatch (Bellows)', { fill: INK, 'font-size': 12 });
el('circle', { cx: 144, cy: 240, r: 10, fill: '#fff', stroke: INK, 'stroke-width': 1.6 });
el('circle', { cx: 144, cy: 240, r: 5, fill: 'none', stroke: INK, 'stroke-width': 0.9 });
for (const dx of [-6, 6]) {
  el('line', { x1: 144 + dx, y1: 228, x2: 144 + dx, y2: 156, stroke: INK, 'stroke-width': 1.1, 'stroke-dasharray': '5 4' });
}
el('rect', { x: 130, y: 132, width: 28, height: 22, rx: 2.5, fill: '#fff', stroke: INK, 'stroke-width': 1.6 });

// --- Impact path on the platform: catwalk tiles A2-A9, plus the swing
//     tiles on the corner blocks (B2/B9; B3-B8 are hatched at gear level) ---
for (let c = 1; c <= 8; c++) {
  el('rect', { x: PX0 + c * CELL + 1, y: FACE + 1, width: CELL - 2, height: CAT1 - FACE - 2, fill: 'url(#impact)', stroke: 'none' });
}
for (const c of [1, 8]) {
  el('rect', { x: PX0 + c * CELL + 1, y: CAT1 + 1, width: CELL - 2, height: CELL - 2, fill: 'url(#impact)', stroke: 'none' });
}
// door swing sweeps (10-ft half-discs from each hinge)
el('path', { d: `M ${RODX} ${FACE} A ${LEAF} ${LEAF} 0 0 1 ${DX0 - LEAF} ${FACE}`,
  fill: 'none', stroke: INK, 'stroke-width': 2, 'stroke-dasharray': '10 7' });
el('path', { d: `M ${RODX} ${FACE} A ${LEAF} ${LEAF} 0 0 0 ${DX1 + LEAF} ${FACE}`,
  fill: 'none', stroke: INK, 'stroke-width': 2, 'stroke-dasharray': '10 7' });

// --- Rod (telescoping) + perch on the gear hub ---
for (const [hw, y0, y1] of [[18, FACE - 10, 336], [13, 336, 480], [9, 480, HUBY - 44]]) {
  el('rect', { x: RODX - hw, y: y0, width: 2 * hw, height: y1 - y0, fill: '#fff', stroke: INK, 'stroke-width': 2 });
}
for (const [hw, yj] of [[13, 336], [18, 480]]) {
  el('rect', { x: RODX - hw - 4, y: yj - 4, width: 2 * (hw + 4), height: 8, fill: '#fff', stroke: INK, 'stroke-width': 1.2 });
}
function octagon(r) {
  return Array.from({ length: 8 }, (_, i) => {
    const a = (i * 45 + 22.5) * Math.PI / 180;
    return `${(HUBX + r * Math.cos(a)).toFixed(1)},${(HUBY + r * Math.sin(a)).toFixed(1)}`;
  }).join(' ');
}
el('polygon', { points: octagon(56), fill: 'none', stroke: INK, 'stroke-width': 3 });
el('polygon', { points: octagon(43), fill: 'none', stroke: INK, 'stroke-width': 1.2 });

// --- Zone labels on white plates ---
function plate(x, y, w, h, lines, fontSize) {
  el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, fill: '#fff', stroke: INK, 'stroke-width': 1.5 });
  const lh = fontSize + 6;
  const y0 = y - ((lines.length - 1) * lh) / 2 + fontSize * 0.35;
  lines.forEach((s, i) => txt(x, y0 + i * lh, s, { fill: INK, 'font-size': fontSize, 'letter-spacing': 2, 'font-weight': 700 }));
}
plate(CX, OY + 2.5 * CELL, 150, 62, ['IMPACT', 'PATH'], 20);
plate(CX, CY, 158, 62, ['CUCKOO', '10×10 FT'], 20);
plate(CX, OY + 7.5 * CELL, 210, 62, ['BELLOWS CONE', '30 FT'], 20);

// --- Coordinates ---
for (let i = 0; i < COLS; i++) {
  txt(OX + i * CELL + CELL / 2, OY + H + 78, String(i + 1), { fill: INK, 'font-size': 18 });
}
for (let i = 0; i < ROWS; i++) {
  txt(OX - 70, OY + i * CELL + CELL / 2 + 6, String.fromCharCode(65 + i), { fill: INK, 'font-size': 18 });
}

// --- Legend + rules ---
txt(PAGE_W / 2, 1204, "CUCKOO'S LANDING — DM REFERENCE", { fill: INK, 'font-size': 26, 'font-weight': 700, 'letter-spacing': 3 });

const LEGEND = [
  { swatch: g => el('rect', { x: 0, y: 0, width: 38, height: 38, fill: 'url(#cuckoo)', stroke: INK, 'stroke-width': 3 }, g),
    label: 'Cuckoo (10×10 ft, Large, restrained on the rod)' },
  { swatch: g => el('rect', { x: 0, y: 0, width: 38, height: 38, fill: 'url(#impact)', stroke: INK, 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }, g),
    label: 'Impact path: rod corridor + door swing' },
  { swatch: g => el('rect', { x: 0, y: 0, width: 38, height: 38, fill: 'url(#cone)', stroke: INK, 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }, g),
    label: 'Bellows cone (DC 14 CON, on-rounds)' },
  { swatch: g => { el('rect', { x: 0, y: 0, width: 38, height: 19, fill: 'url(#wall)', stroke: INK, 'stroke-width': 1 }, g);
      el('rect', { x: 0, y: 19, width: 38, height: 19, fill: '#fff', stroke: INK, 'stroke-width': 1 }, g); },
    label: 'Platform overlay (fixed): row A = squeeze catwalk' },
];
const LY = 1240;
const legColX = [64, 616];
LEGEND.forEach((item, i) => {
  const x = legColX[i % 2], y = LY + Math.floor(i / 2) * 58;
  const g = el('g', { transform: `translate(${x} ${y})` });
  item.swatch(g);
  txt(x + 50, y + 26, item.label, { fill: INK, 'font-size': 17, 'text-anchor': 'start' });
});

const RULES = [
  'Init 20 = the machine: rotate 90° CW → emerge/retract → wave → Call. Platform/doors/rod never rotate.',
  'Emerge/retract: DEX save in the impact path or knocked down; door swing: A2-B9 + C3-C4 / C7-C8',
  'Row A catwalk = half squares: squeezing (1/2 speed, disadv. on attacks, attacks against them have adv.)',
  'Aperture blocked while the cuckoo is out — ride it in: DC 12 STR (Athletics) as it retracts',
];
RULES.forEach((s, i) => txt(PAGE_W / 2, 1382 + i * 27, s, { fill: INK, 'font-size': 17.5, 'font-weight': i === 0 ? 700 : 400 }));
</script>

</body>
</html>
