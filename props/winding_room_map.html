<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Winding Room — Print Battle Map (12×18 in ×2 pages, 1 in = 5 ft)</title>
<style>
  @page { size: 12in 18in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 12in; height: 18in; page-break-after: always; }
  svg:last-child { page-break-after: auto; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 1728"></svg>
<svg id="tokens" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 1728"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const svg2 = document.getElementById('tokens');
function el(name, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function txt(x, y, str, attrs = {}, parent = svg) {
  const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs), parent);
  t.textContent = str;
  return t;
}

// 1 in = 5 ft = 96 units. Page 1: the room (9×14 squares). Page 2: four cut-out
// 3×3 pinecone counterweight tokens (they hang from the winding chains and are
// dropped into the six berths; place per the DM guide's start positions).
// Chain pairings are NOT printed — players learn them by tracing.
const CELL = 96, COLSN = 9;
const ROWS = "ABCDEFGHIJKLMN";
const PAGE_W = 1152, PAGE_H = 1728;
const W = COLSN * CELL, H = ROWS.length * CELL;
const OX = (PAGE_W - W) / 2, OY = 190;
const INK = '#000';

// --- Walkable floor (same layout as tools/winding_room_sim.*) ---
const base = new Set();
for (let c = 3; c <= 7; c++) base.add("N" + c);
for (let c = 2; c <= 8; c++) base.add("M" + c);
for (const r of "DEFGHIJKL") for (const c of [2, 5, 8]) base.add(r + c);
["K3", "K4", "G6", "G7"].forEach(s => base.add(s));
for (let c = 2; c <= 5; c++) base.add("C" + c);
base.add("C8");
for (let c = 2; c <= 5; c++) { base.add("A" + c); base.add("B" + c); }
["A7", "B7", "A8", "B8"].forEach(s => base.add(s));
const CHAIN_SQ = ["G2", "G6", "M3", "K2", "B4", "C3", "L2", "C8"];
const BERTHS = [];
for (const rr of ["E", "I"]) for (const cc of [2, 5, 8]) BERTHS.push(rr + cc);

function xy(cell) {
  return [OX + (parseInt(cell[1]) - 1) * CELL, OY + ROWS.indexOf(cell[0]) * CELL];
}

// --- Defs: machinery hatch ---
const defs = el('defs');
const pat = el('pattern', { id: 'mach', width: 9, height: 9, patternUnits: 'userSpaceOnUse' }, defs);
el('path', { d: 'M0 9 L9 0', stroke: INK, 'stroke-width': 0.7, fill: 'none' }, pat);

el('rect', { x: 0, y: 0, width: PAGE_W, height: PAGE_H, fill: '#fff' });

// --- Cells ---
for (let r = 0; r < ROWS.length; r++) {
  for (let c = 1; c <= COLSN; c++) {
    const cell = ROWS[r] + c;
    const x = OX + (c - 1) * CELL, y = OY + r * CELL;
    if (base.has(cell)) {
      el('rect', { x, y, width: CELL, height: CELL, fill: '#fff', stroke: INK, 'stroke-width': 0.9 });
    } else {
      el('rect', { x, y, width: CELL, height: CELL, fill: 'url(#mach)', stroke: INK, 'stroke-width': 0.6 });
    }
  }
}

// --- Berth shadows: the pinecones hang somewhere above each drop point;
//     a soft shadow on the floor marks the spot.
//     Two renderings: 'gradient' (smooth, browser-pretty) and 'stipple'
//     (deterministic vector dots — prints identically on any RIP) ---
const SHADOW_STYLE = 'gradient';
if (SHADOW_STYLE === 'gradient') {
  const shGrad = el('radialGradient', { id: 'shadow' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#000', 'stop-opacity': 0.30 }, shGrad);
  el('stop', { offset: '65%', 'stop-color': '#000', 'stop-opacity': 0.17 }, shGrad);
  el('stop', { offset: '100%', 'stop-color': '#000', 'stop-opacity': 0 }, shGrad);
  for (const b of BERTHS) {
    const [x, y] = xy(b);
    el('circle', { cx: x + CELL / 2, cy: y + CELL / 2, r: 88, fill: 'url(#shadow)' });
  }
} else {
  for (const b of BERTHS) {
    const [x, y] = xy(b);
    const cx = x + CELL / 2, cy = y + CELL / 2;
    const N = 110, R = 86, GA = 137.508;
    for (let k = 1; k <= N; k++) {
      const jr = Math.abs(Math.sin(k * 12.9898) * 43758.5453 % 1);  // deterministic jitter
      const ja = Math.abs(Math.sin(k * 78.233) * 12543.123 % 1);
      const r = R * Math.pow(k / N, 0.8) * (0.92 + 0.16 * jr);
      const a = (k * GA + ja * 9) * Math.PI / 180;
      const dr = 2.3 - 1.2 * (r / R);                               // dots shrink outward
      el('circle', { cx: cx + Math.cos(a) * r, cy: cy + Math.sin(a) * r, r: dr, fill: INK });
    }
  }
}

// --- Pull-chains: hanging chain of double-outlined links, upper corner of the square ---
for (const sq of CHAIN_SQ) {
  const [x, y] = xy(sq);
  const cx = x + CELL - 18;
  // face links first: stadium rings outlined with two lines
  for (const ly of [8, 30, 52]) {
    el('rect', { x: cx - 6, y: y + ly, width: 12, height: 18, rx: 6, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
    el('rect', { x: cx - 3, y: y + ly + 3, width: 6, height: 12, rx: 3, fill: 'none', stroke: INK, 'stroke-width': 1.1 });
  }
  // cross links on top: slim double-outlined bars passing over the bands
  for (const [a, b] of [[1, 13], [22, 34], [44, 56]]) {
    el('rect', { x: cx - 2.5, y: y + a, width: 5, height: b - a, rx: 2.5, fill: '#fff', stroke: INK, 'stroke-width': 1.3 });
  }
}

// --- Cradle: circular frame on the A/B - 3/4 intersection, grid masked out,
//     with a connector gear train running into the works beyond the north wall ---
const crX = OX + 3 * CELL, crY = OY + 1 * CELL;
function smallGear(cx, cy, r, n, h, hb, ht, sw, a0 = 0) {
  const step = 360 / n;
  function toothPts(aDeg) {
    const a = aDeg * Math.PI / 180;
    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
    const rot = (aDeg + 90) * Math.PI / 180;
    const c = Math.cos(rot), s = Math.sin(rot);
    return [[-hb, 0], [-ht, -h], [ht, -h], [hb, 0]]
      .map(([px2, py2]) => [px + px2 * c - py2 * s, py + px2 * s + py2 * c].map(v => v.toFixed(2)));
  }
  let d = '';
  for (let i = 0; i < n; i++) {
    const [bl, tl, tr, br] = toothPts(a0 + i * step);
    d += (i === 0 ? `M ${bl}` : ` A ${r} ${r} 0 0 1 ${bl}`);
    d += ` L ${tl} L ${tr} L ${br}`;
  }
  d += ` A ${r} ${r} 0 0 1 ${toothPts(a0)[0]} Z`;
  el('path', { d, fill: '#fff', stroke: INK, 'stroke-width': sw });
  el('circle', { cx, cy, r: r - 5, fill: 'none', stroke: INK, 'stroke-width': 0.9 });
  el('circle', { cx, cy, r: 3, fill: 'none', stroke: INK, 'stroke-width': 1.5 });
}
const ux = -0.55, uy = -0.835;                    // up-left, toward the north wall
const g1 = [crX + ux * 66, crY + uy * 66];        // idles just off the cradle rim, waiting for the Gear
const g2 = [g1[0] + ux * 33, g1[1] + uy * 33];    // meshes with g1, runs into the wall works
smallGear(g1[0], g1[1], 15, 8, 6, 4.5, 2.8, 2, -12);  // rotated so its teeth mesh into g2's gaps
smallGear(g2[0], g2[1], 10, 6, 5, 3.6, 2.2, 1.8);
el('circle', { cx: crX, cy: crY, r: 45, fill: '#fff', stroke: 'none' }); // mask grid beneath the frame
el('circle', { cx: crX, cy: crY, r: 42, fill: 'none', stroke: INK, 'stroke-width': 4 });
el('circle', { cx: crX, cy: crY, r: 34, fill: 'none', stroke: INK, 'stroke-width': 1.2 });
el('circle', { cx: crX, cy: crY, r: 10, fill: 'none', stroke: INK, 'stroke-width': 2 });

// --- Fritz's camp at A7: child-size bedroll and a plank crate with candle stub ---
const [cpx, cpy] = xy("A7");
el('rect', { x: cpx + 8, y: cpy + 10, width: 78, height: 30, rx: 14, fill: '#fff', stroke: INK, 'stroke-width': 1.8 });
el('rect', { x: cpx + 12, y: cpy + 13, width: 16, height: 24, rx: 8, fill: 'none', stroke: INK, 'stroke-width': 1.1 });
el('path', { d: `M ${cpx + 44} ${cpy + 11} q -4 14 0 28 M ${cpx + 62} ${cpy + 11} q 4 14 0 28`,
             fill: 'none', stroke: INK, 'stroke-width': 0.9 });
el('rect', { x: cpx + 14, y: cpy + 50, width: 38, height: 38, fill: '#fff', stroke: INK, 'stroke-width': 1.8 });
el('line', { x1: cpx + 26.5, y1: cpy + 50, x2: cpx + 26.5, y2: cpy + 88, stroke: INK, 'stroke-width': 0.8 });
el('line', { x1: cpx + 39.5, y1: cpy + 50, x2: cpx + 39.5, y2: cpy + 88, stroke: INK, 'stroke-width': 0.8 });
el('circle', { cx: cpx + 33, cy: cpy + 69, r: 4.5, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
el('circle', { cx: cpx + 33, cy: cpy + 69, r: 1.3, fill: INK });

// --- Stairs up at N5 ---
const [stx, sty] = xy("N5");
for (let i = 1; i <= 4; i++) {
  el('line', { x1: stx + 12, y1: sty + i * (CELL / 5), x2: stx + CELL - 12, y2: sty + i * (CELL / 5), stroke: INK, 'stroke-width': 1.5 });
}

// --- Outer wall ---
el('rect', { x: OX, y: OY, width: W, height: H, fill: 'none', stroke: INK, 'stroke-width': 5 });

// --- Coordinates ---
for (let c = 1; c <= COLSN; c++) {
  txt(OX + (c - 1) * CELL + CELL / 2, OY + H + 28, String(c), { fill: INK, 'font-size': 18 });
}
for (let r = 0; r < ROWS.length; r++) {
  txt(OX - 30, OY + r * CELL + CELL / 2 + 6, ROWS[r], { fill: INK, 'font-size': 18 });
}

// ================= PAGE 2: pinecone counterweight tokens =================
el('rect', { x: 0, y: 0, width: PAGE_W, height: PAGE_H, fill: '#fff' }, svg2);

// Top-down pinecone, built like the real thing: rhombic scales placed by
// golden-angle phyllotaxis (137.5° per scale), sizes growing outward, so the
// crossing Fibonacci spirals emerge naturally. Each scale carries a small
// central umbo mark. Outermost drawn first; inner scales overlap them.
function pinecone(cx, cy, parent) {
  const N = 55, RMAX = 105, GA = 137.508;
  const pts = [];
  for (let k = 1; k <= N; k++) {
    pts.push({ r: RMAX * Math.sqrt(k / N), a: k * GA });
  }
  pts.sort((p, q) => q.r - p.r);
  for (const p of pts) {
    const rad = p.a * Math.PI / 180;
    const px = cx + Math.cos(rad) * p.r, py = cy + Math.sin(rad) * p.r;
    const t = p.r / RMAX;                        // 0 at center, 1 at the rim
    const L = 15 + p.r * 0.24;
    const w = (12 + p.r * 0.17) * (1 + 0.22 * t); // outer scales broaden...
    const tw = w * 0.5 * t;                       // ...and their tips go blunt
    const L0 = L * (1 - 0.18 * t);
    // scale plate: pointed near the center, broad rounded lobe at the rim
    const d = `M ${-tw} ${-L0} Q 0 ${-L} ${tw} ${-L0} Q ${w * 0.95} ${-L * 0.35} ${w} ${L * 0.05} ` +
              `Q ${w * 0.6} ${L * 0.75} 0 ${L * 0.85} Q ${-w * 0.6} ${L * 0.75} ${-w} ${L * 0.05} ` +
              `Q ${-w * 0.95} ${-L * 0.35} ${-tw} ${-L0} Z`;
    const tf = `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(p.a + 90).toFixed(1)})`;
    el('path', { d, fill: '#fff', stroke: INK, 'stroke-width': 1.3, transform: tf }, parent);
    el('line', { x1: 0, y1: -L * 0.55, x2: 0, y2: -L * 0.15, stroke: INK, 'stroke-width': 1.3, transform: tf }, parent);
  }
  el('circle', { cx, cy, r: 7, fill: '#fff', stroke: INK, 'stroke-width': 1.5 }, parent);
  el('circle', { cx, cy, r: 2.5, fill: INK }, parent);
}

const TOKC = [[392, 460], [760, 460], [392, 880], [760, 880]];
for (const [cx, cy] of TOKC) {
  el('circle', { cx, cy, r: 154, fill: 'none', stroke: INK, 'stroke-width': 0.8, 'stroke-dasharray': '7 6' }, svg2);  // cut line
  pinecone(cx, cy, svg2);
}
</script>

</body>
</html>
