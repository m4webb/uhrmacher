<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Winding Room — DM Reference (letter landscape)</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 11in; height: 8.5in; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
function el(name, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function txt(x, y, str, attrs = {}, parent = svg) {
  const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs), parent);
  t.textContent = str;
  return t;
}

// Same layout as the print map, half scale, plus DM overlays:
// weight start positions, chain pairings, golem + Fritz markers.
const CELL = 46, COLSN = 9;
const ROWS = "ABCDEFGHIJKLMN";
const OX = 56, OY = 64;
const W = COLSN * CELL, H = ROWS.length * CELL;
const INK = '#000';

const base = new Set();
for (let c = 3; c <= 7; c++) base.add("N" + c);
for (let c = 2; c <= 8; c++) base.add("M" + c);
for (const r of "DEFGHIJKL") for (const c of [2, 5, 8]) base.add(r + c);
["K3", "K4", "G6", "G7"].forEach(s => base.add(s));
for (let c = 2; c <= 5; c++) base.add("C" + c);
base.add("C8");
for (let c = 2; c <= 5; c++) { base.add("A" + c); base.add("B" + c); }
["A7", "B7", "A8", "B8"].forEach(s => base.add(s));
const RAIL_ROWS = ["E", "I"];
// chains: square -> [pairing label, effect summary]
const CHAINS = {
  G2: "↓I2", G6: "I5↓", M3: "↓I5", K2: "I8↓",
  B4: "E5↓", C3: "↓E2", L2: "↓E5", C8: "E8↓",
};
function xy(cell) {
  return [OX + (parseInt(cell[1]) - 1) * CELL, OY + ROWS.indexOf(cell[0]) * CELL];
}

const defs = el('defs');
const pat = el('pattern', { id: 'mach', width: 5, height: 5, patternUnits: 'userSpaceOnUse' }, defs);
el('path', { d: 'M0 5 L5 0', stroke: INK, 'stroke-width': 0.5, fill: 'none' }, pat);

el('rect', { x: 0, y: 0, width: 1056, height: 816, fill: '#fff' });

// --- Cells ---
for (let r = 0; r < ROWS.length; r++) {
  for (let c = 1; c <= COLSN; c++) {
    const cell = ROWS[r] + c;
    const x = OX + (c - 1) * CELL, y = OY + r * CELL;
    if (base.has(cell)) {
      el('rect', { x, y, width: CELL, height: CELL, fill: '#fff', stroke: INK, 'stroke-width': 0.6 });
    } else {
      el('rect', { x, y, width: CELL, height: CELL, fill: 'url(#mach)', stroke: INK, 'stroke-width': 0.4 });
    }
  }
}
// --- Berths (six drop points) + pinecone START positions (DM overlay) ---
for (const rr of RAIL_ROWS) {
  for (const cc of [2, 5, 8]) {
    el('circle', { cx: OX + (cc - 1) * CELL + CELL / 2, cy: OY + ROWS.indexOf(rr) * CELL + CELL / 2,
                   r: 64, fill: 'none', stroke: INK, 'stroke-width': 0.7, 'stroke-dasharray': '5 4' });
  }
}
const PSTART = [
  { row: "E", c: 2, label: "DOWN" },   // dropped west
  { row: "E", c: 5, label: "DOWN" },   // dropped middle
  { row: "I", c: 5, label: "DOWN" },   // dropped middle
  { row: "I", c: 8, label: "DOWN" },   // dropped east
];
for (const ps of PSTART) {
  const cx = OX + (ps.c - 1) * CELL + CELL / 2, cy = OY + ROWS.indexOf(ps.row) * CELL + CELL / 2;
  el('circle', { cx, cy, r: 62, fill: '#d9d9d9', stroke: INK, 'stroke-width': 1.6 });
  el('circle', { cx, cy, r: 44, fill: 'none', stroke: INK, 'stroke-width': 0.8, 'stroke-dasharray': '6 4' });
  el('circle', { cx, cy, r: 26, fill: 'none', stroke: INK, 'stroke-width': 0.8, 'stroke-dasharray': '5 4' });
  txt(cx, cy + 5, ps.label, { fill: INK, 'font-size': 14, 'font-weight': 700 });
}
// --- Chains with pairing labels ---
for (const [sq, label] of Object.entries(CHAINS)) {
  const [x, y] = xy(sq);
  el('circle', { cx: x + CELL/2, cy: y + CELL/2 - 4, r: 10, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
  txt(x + CELL/2, y + CELL/2, label, { fill: INK, 'font-size': 8.5, 'font-weight': 700 });
  txt(x + CELL/2, y + CELL - 3, sq, { fill: INK, 'font-size': 8 });
}
// --- Cradle, camp, golem, stairs ---
const crX = OX + 3 * CELL, crY = OY + 1 * CELL;
el('circle', { cx: crX, cy: crY, r: 21, fill: '#fff', stroke: 'none' });  // mask grid
el('circle', { cx: crX, cy: crY, r: 19, fill: 'none', stroke: INK, 'stroke-width': 2 });
el('circle', { cx: crX, cy: crY, r: 5, fill: 'none', stroke: INK, 'stroke-width': 1 });
const [gx, gy] = xy("G8");
txt(gx + CELL/2, gy + CELL/2 + 5, "G", { fill: INK, 'font-size': 15, 'font-weight': 700 });
const [fx, fy] = xy("A7");
txt(fx + CELL/2, fy + CELL/2 + 5, "F", { fill: INK, 'font-size': 15, 'font-weight': 700 });
const [stx, sty] = xy("N5");
for (let i = 1; i <= 3; i++) {
  el('line', { x1: stx + 8, y1: sty + i * (CELL/4), x2: stx + CELL - 8, y2: sty + i * (CELL/4), stroke: INK, 'stroke-width': 1 });
}
el('rect', { x: OX, y: OY, width: W, height: H, fill: 'none', stroke: INK, 'stroke-width': 2.5 });
// coordinates
for (let c = 1; c <= COLSN; c++) txt(OX + (c-1)*CELL + CELL/2, OY + H + 18, String(c), { fill: INK, 'font-size': 10 });
for (let r = 0; r < ROWS.length; r++) txt(OX - 16, OY + r*CELL + CELL/2 + 3, ROWS[r], { fill: INK, 'font-size': 10 });

// ============ RIGHT PANEL ============
const PX = 540;
txt((PX + 1020) / 2, 52, "WINDING ROOM — DM REFERENCE", { fill: INK, 'font-size': 21, 'font-weight': 700, 'letter-spacing': 2 });
txt((PX + 1020) / 2, 78, "START: weights down at E2 · E5 · I5 · I8 — sealed (upper open E, lower open W)",
  { fill: INK, 'font-size': 11.5 });

// Chain table
const TABLE = [
  ["G2", "↓I2 ↑I5", "opens I5 · closes I2 — FIRST PULL: traps puller in gallery, frees golem"],
  ["G6", "I5↓ ↑I2", "opens I2 · closes I5 — re-arm chain; pulled inside = sealed in cage"],
  ["M3", "↓I5 ↑I8", "opens I8 · closes I5"],
  ["K2", "I8↓ ↑I5", "opens I5 · closes I8"],
  ["B4", "E5↓ ↑E2", "opens E2 · closes E5 — backroom"],
  ["C3", "↓E2 ↑E5", "opens E5 · closes E2 — backroom, endgame control"],
  ["L2", "↓E5 ↑E8", "opens E8 · closes E5"],
  ["C8", "E8↓ ↑E5", "opens E5 · closes E8 — Fritz's chain: seals the puller in his corner"],
];
let ty = 108;
txt(PX, ty, "CHAIN", { fill: INK, 'font-size': 11, 'font-weight': 700, 'text-anchor': 'start' });
txt(PX + 68, ty, "WEIGHTS", { fill: INK, 'font-size': 11, 'font-weight': 700, 'text-anchor': 'start' });
txt(PX + 148, ty, "EFFECT", { fill: INK, 'font-size': 11, 'font-weight': 700, 'text-anchor': 'start' });
el('line', { x1: PX, y1: ty + 6, x2: 1020, y2: ty + 6, stroke: INK, 'stroke-width': 1 });
ty += 24;
for (const [sq, label, eff] of TABLE) {
  txt(PX, ty, sq, { fill: INK, 'font-size': 11, 'font-weight': 700, 'text-anchor': 'start' });
  txt(PX + 68, ty, label, { fill: INK, 'font-size': 11, 'text-anchor': 'start' });
  const words = eff.split(' — ');
  txt(PX + 148, ty, words[0], { fill: INK, 'font-size': 10.5, 'text-anchor': 'start' });
  if (words[1]) { ty += 15; txt(PX + 148, ty, words[1], { fill: INK, 'font-size': 10, 'font-style': 'italic', 'text-anchor': 'start' }); }
  ty += 20;
}

// Rules
ty += 8;
txt(PX, ty, "RULES", { fill: INK, 'font-size': 12, 'font-weight': 700, 'text-anchor': 'start', 'letter-spacing': 1 });
el('line', { x1: PX, y1: ty + 6, x2: 1020, y2: ty + 6, stroke: INK, 'stroke-width': 1 });
ty += 22;
const RULES = [
  "Pulling a chain = 1 action. Chains are reusable; they grind or jam audibly.",
  "Six PINECONES (3x3 footprints), one hanging above each berth; at any moment",
  "  two per level are down (four on the map). A pull lowers one, raises another.",
  "Each level always leaves exactly one lane open.",
  "Under a descending pinecone: DC 14 DEX, dive adjacent; fail 2d6 + prone.",
  "Trace a chain (action + easy Investigation) to learn which berths it works.",
  "Arrow side = travel direction of the load: ↓I5 arrives at I5 from the east, I5↓ from the west.",
  "Golem: starts caged at G8; freed by the first effective pull (G2).",
  "  It never damages machinery - blocked lanes stop it. Anyone may pull chains.",
  "Fritz: home at A7-B8 (door via C8 square). C8 chain = his self-seal reveal.",
  "Sightlines: machinery blocks ranged fire except along open lanes.",
];
for (const line of RULES) {
  txt(PX, ty, line, { fill: INK, 'font-size': 11, 'text-anchor': 'start' });
  ty += 18;
}
</script>

</body>
</html>
