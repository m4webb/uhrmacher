<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cuckoo's Landing — Platform Overlay (2 pages: platform sheet / rod piece)</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 11in; height: 8.5in; page-break-after: always; }
  svg:last-child { page-break-after: auto; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>
<svg id="rod" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';

// Overlay set for the Cuckoo's Landing print map (cuckoos_landing_map.html).
// Base map: CELL=96, grid origin (96,96), gear center (576,576), R=480.
// Sheet transform: sheet_x = map_x - 48, sheet_y = map_y + 44.
//
// ONE generic platform sheet (doors printed closed) + ONE rod piece that sits
// ON TOP: the piece's T-head is the open doorway (void aperture + leaves
// swung flat against the wall), so placing it covers the closed doors —
// doors burst open and the cuckoo deploys in a single gesture. Lift it off
// on OFF cycles and the doors are closed again.
//
// Row A is a HALF-DEPTH CATWALK (48 units = 2.5 ft — creatures squeeze),
// level with the gear for play. Corner blocks B1-B2 / B9-B10 are full squares.
// No bold line across the back — the tower structure continues.
// Doors: two 10-ft leaves (2 squares each), aperture spanning cols 4-7.
// Fully placed, the piece's perch centers exactly on the gear hub:
// perch center = map (576,576) = sheet (528,620).
const SX = x => x - 48, SY = y => y + 44;
const CELL = 96, INK = '#000';

const PX0 = SX(96),  PX1 = SX(1056);          // platform west/east = 48 / 1008
const PAY0 = SY(96), PAY1 = SY(192);          // row A top/bottom  = 140 / 236
const CTOP = PAY0 + 48;                        // catwalk top (half-square) = 188
const PBY1 = SY(288);                          // row B bottom      = 332
const WBX0 = SX(288), EBX0 = SX(864);          // corner block inner edges = 240 / 816
const WALL0 = CTOP - 40;                       // wall chase depth reference = 148
const BTOP  = WALL0 - 96;                      // structure top (trim edge) = 52
const DX0 = SX(384), DX1 = SX(768);            // door aperture, 4 squares (cols 4-7) = 336 / 720
const RODX = SX(576);                          // rod centerline = 528
const HUB = [SX(576), SY(576)];                // perch center, placed = (528, 620)
const LEAF = DX1 - RODX;                       // leaf length = 192 (10 ft)

console.log('catwalk', PX0, PX1, CTOP, PAY1, 'corners to', PBY1,
            'aperture', DX0, DX1, 'leaf', LEAF, 'hub', HUB, 'structure top', BTOP);

// sheet silhouette; the DRAWN cut line omits the top segment — the tower
// continues behind the sheet edge
const outlineClosed = `M ${PX0} ${BTOP} H ${PX1} V ${PBY1} H ${EBX0} V ${PAY1} H ${WBX0} V ${PBY1} H ${PX0} Z`;
const outlineDrawn  = `M ${PX0} ${BTOP} L ${PX0} ${PBY1} H ${WBX0} V ${PAY1} H ${EBX0} V ${PBY1} H ${PX1} L ${PX1} ${BTOP}`;

function maker(svg) {
  function el(name, attrs = {}, parent = svg) {
    const n = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  }
  function txt(x, y, str, attrs = {}) {
    const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs));
    t.textContent = str;
    return t;
  }
  return { el, txt };
}

function patterns(el, prefix) {
  const defs = el('defs');
  const wallPat = el('pattern', { id: prefix + 'wall', width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M0 7 L7 0', stroke: INK, 'stroke-width': 0.4, fill: 'none' }, wallPat);
  const voidPat = el('pattern', { id: prefix + 'void', width: 5, height: 5, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M0 5 L5 0 M0 0 L5 5', stroke: INK, 'stroke-width': 0.4, fill: 'none' }, voidPat);
}

// ============ Page 1: the platform sheet (doors closed) ============
function buildSheet(svg) {
  const { el, txt } = maker(svg);
  patterns(el, 's');

  el('rect', { x: 0, y: 0, width: 1056, height: 816, fill: '#fff' });
  el('path', { d: outlineClosed, fill: '#fff', stroke: 'none' });

  // --- Interior grid: half-depth catwalk cells + full corner cells ---
  for (let c = 0; c <= 10; c++) {
    const x = PX0 + c * CELL;
    const yEnd = (x <= WBX0 || x >= EBX0) ? PBY1 : PAY1;
    el('line', { x1: x, y1: CTOP, x2: x, y2: yEnd, stroke: INK, 'stroke-width': 1 });
  }
  el('line', { x1: PX0, y1: PAY1, x2: PX1, y2: PAY1, stroke: INK, 'stroke-width': 1 });
  el('line', { x1: PX0, y1: PBY1, x2: WBX0, y2: PBY1, stroke: INK, 'stroke-width': 1 });
  el('line', { x1: EBX0, y1: PBY1, x2: PX1, y2: PBY1, stroke: INK, 'stroke-width': 1 });

  // --- Tower structure: one uniform solid field from the back edge down to
  //     the wall face at the catwalk (the top half of row A is wall) ---
  el('rect', { x: PX0, y: BTOP, width: PX1 - PX0, height: CTOP - BTOP, fill: 'url(#swall)', stroke: 'none' });
  for (const [x0, x1] of [[PX0, DX0], [DX1, PX1]]) {
    el('line', { x1: x0, y1: CTOP, x2: x1, y2: CTOP, stroke: INK, 'stroke-width': 1.5 });   // wall face
  }
  // shallow doorway recess, exactly leaf-deep so the doors seat flush
  el('rect', { x: DX0, y: CTOP - 10, width: DX1 - DX0, height: 10, fill: '#fff', stroke: 'none' });
  el('line', { x1: DX0, y1: CTOP - 10, x2: DX1, y2: CTOP - 10, stroke: INK, 'stroke-width': 1.2 });
  for (const jx of [DX0, DX1]) {
    el('line', { x1: jx, y1: CTOP - 10, x2: jx, y2: CTOP, stroke: INK, 'stroke-width': 2.5 });  // doorway posts
  }

  // --- Closed doors: two thin 10-ft leaves across the mouth (plan view) ---
  for (const [lx0, lx1] of [[DX0, RODX], [RODX, DX1]]) {
    el('rect', { x: lx0, y: CTOP - 10, width: lx1 - lx0, height: 16, fill: '#fff', stroke: INK, 'stroke-width': 2.2 });
    el('line', { x1: lx0 + 8, y1: CTOP - 2, x2: lx1 - 8, y2: CTOP - 2, stroke: INK, 'stroke-width': 0.8 });
  }
  el('line', { x1: RODX, y1: CTOP - 10, x2: RODX, y2: CTOP + 6, stroke: INK, 'stroke-width': 2.2 });
  for (const px of [RODX - 12, RODX + 12]) {
    el('circle', { cx: px, cy: CTOP - 2, r: 2.2, fill: 'none', stroke: INK, 'stroke-width': 1.1 });
  }
  for (const hx of [DX0, DX1]) {
    el('circle', { cx: hx, cy: CTOP, r: 3, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
  }

  // --- Hatch up from the Bellows Chamber (trapdoor, B2) ---
  const hx0 = SX(192) + 8, hy0 = SY(192) + 8, hs = CELL - 16;
  el('rect', { x: hx0, y: hy0, width: hs, height: hs, fill: '#fff', stroke: INK, 'stroke-width': 2.5 });
  el('rect', { x: hx0 + 7, y: hy0 + 7, width: hs - 14, height: hs - 14, fill: 'none', stroke: INK, 'stroke-width': 1 });
  for (let i = 1; i <= 4; i++) {
    el('line', { x1: hx0 + 12, y1: hy0 + 7 + i * (hs - 14) / 5, x2: hx0 + hs - 12, y2: hy0 + 7 + i * (hs - 14) / 5, stroke: INK, 'stroke-width': 1.5 });
  }
  for (const ty of [hy0 + 14, hy0 + hs - 14]) {
    el('line', { x1: hx0 - 5, y1: ty, x2: hx0 + 4, y2: ty, stroke: INK, 'stroke-width': 2.5 });
  }

  // --- Air riser (B1): up through the deck, across the A1 catwalk, and
  //     into the tower at the A1 half-wall ---
  const RX = SX(144), RYB = SY(240);
  el('circle', { cx: RX, cy: RYB, r: 12, fill: '#fff', stroke: INK, 'stroke-width': 2 });
  el('circle', { cx: RX, cy: RYB, r: 6, fill: 'none', stroke: INK, 'stroke-width': 1 });
  el('rect', { x: RX - 9, y: CTOP + 8, width: 18, height: RYB - 14 - (CTOP + 8), fill: '#fff', stroke: 'none' });
  for (const dx of [-7, 7]) {
    el('line', { x1: RX + dx, y1: RYB - 14, x2: RX + dx, y2: CTOP + 9, stroke: INK, 'stroke-width': 1.3, 'stroke-dasharray': '6 4' });
  }
  // entry hardware: bolted junction plate where the pipe enters the tower
  // at the A1 half-wall
  el('rect', { x: RX - 14, y: CTOP - 12, width: 28, height: 22, rx: 2.5, fill: '#fff', stroke: INK, 'stroke-width': 2 });
  el('line', { x1: RX - 14, y1: CTOP - 4, x2: RX + 14, y2: CTOP - 4, stroke: INK, 'stroke-width': 1 });
  for (const bx of [RX - 9, RX + 9]) {
    el('circle', { cx: bx, cy: CTOP + 4, r: 1.8, fill: 'none', stroke: INK, 'stroke-width': 1 });
  }

  // --- Bold cut outline last (sides + platform edge; open across the back) ---
  el('path', { d: outlineDrawn, fill: 'none', stroke: INK, 'stroke-width': 4 });

  txt(528, 790, "CUCKOO'S LANDING — PLATFORM OVERLAY · row A: half-depth catwalk (squeeze) · trim back along hatch edge", { fill: INK, 'font-size': 12, 'letter-spacing': 0.5 });
}

// ============ Page 2: the rod piece (sits ON TOP of the sheet) ============
// T-shape drawn at its native placement coordinates: head = the OPEN doorway
// (deep void aperture + leaves swung flat against the wall), stem = the
// telescoping rod, foot = the cuckoo's perch. Placing the piece covers the
// sheet's closed doors; lifting it closes them again.
function buildRod(svg) {
  const { el, txt } = maker(svg);
  patterns(el, 'r');
  el('rect', { x: 0, y: 0, width: 1056, height: 816, fill: '#fff' });

  const WINGY = CTOP, WINGH = 13;                    // open leaves on the wall face

  // --- head: the open doorway — an empty threshold (you just see the
  //     opening from above), covering the sheet's closed doors ---
  el('rect', { x: DX0 - 3, y: CTOP - 13, width: (DX1 - DX0) + 6, height: 21, fill: '#fff', stroke: INK, 'stroke-width': 4 });

  // --- wings: the two leaves, swung 180° flat against the wall ---
  for (const [hx, dir] of [[DX0, -1], [DX1, 1]]) {
    const wx0 = hx + (dir > 0 ? 0 : -LEAF);
    el('rect', { x: wx0, y: WINGY, width: LEAF, height: WINGH, fill: '#fff', stroke: INK, 'stroke-width': 2.2 });
    el('line', { x1: wx0 + 8, y1: WINGY + WINGH / 2, x2: wx0 + LEAF - 8, y2: WINGY + WINGH / 2, stroke: INK, 'stroke-width': 0.8 });
    el('circle', { cx: hx + dir * (LEAF - 6), cy: WINGY + WINGH / 2, r: 2.2, fill: 'none', stroke: INK, 'stroke-width': 1.1 });
    el('circle', { cx: hx, cy: CTOP, r: 3, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
  }

  // --- stem: telescoping rod from the mouth to the perch (cut follows it) ---
  const segs = [[18, CTOP - 13, SY(336)], [13, SY(336), SY(480)], [9, SY(480), HUB[1] - 44]];
  for (const [hw, y0, y1] of segs) {
    el('rect', { x: RODX - hw, y: y0, width: 2 * hw, height: y1 - y0, fill: '#fff', stroke: INK, 'stroke-width': 2.5 });
  }
  for (const [hw, yj] of [[13, SY(336)], [18, SY(480)]]) {
    el('rect', { x: RODX - hw - 4, y: yj - 5, width: 2 * (hw + 4), height: 10, fill: '#fff', stroke: INK, 'stroke-width': 1.5 });
  }

  // --- perch: riveted octagon, twin footing bars — lands on the gear hub ---
  function octagon(r) {
    return Array.from({ length: 8 }, (_, i) => {
      const a = (i * 45 + 22.5) * Math.PI / 180;
      return `${(HUB[0] + r * Math.cos(a)).toFixed(1)},${(HUB[1] + r * Math.sin(a)).toFixed(1)}`;
    }).join(' ');
  }
  el('polygon', { points: octagon(56), fill: '#fff', stroke: INK, 'stroke-width': 4 });
  el('polygon', { points: octagon(43), fill: 'none', stroke: INK, 'stroke-width': 1.5 });
  for (let i = 0; i < 8; i++) {
    const a = i * 45 * Math.PI / 180;
    el('circle', { cx: HUB[0] + 49 * Math.cos(a), cy: HUB[1] + 49 * Math.sin(a), r: 2.4, fill: 'none', stroke: INK, 'stroke-width': 1.1 });
  }
  for (const dy of [-7, 7]) {
    el('line', { x1: HUB[0] - 15, y1: HUB[1] + dy, x2: HUB[0] + 15, y2: HUB[1] + dy, stroke: INK, 'stroke-width': 2.2 });
  }

  console.log('rod piece: head', DX0 - 6, CTOP - 18, 'wings to', DX0 - 6 - LEAF, DX1 + 6 + LEAF, 'perch at', HUB);

  txt(528, 760, 'ROD PIECE — cut out; set ON TOP of the platform sheet on ON cycles.', { fill: INK, 'font-size': 13, 'letter-spacing': 1 });
  txt(528, 782, "The head is the open doorway: it covers the sheet's closed doors (doors burst open, cuckoo deploys). Perch lands on the gear hub. Lift off on OFF cycles.", { fill: INK, 'font-size': 11 });
}

buildSheet(document.getElementById('sheet'));
buildRod(document.getElementById('rod'));
</script>

</body>
</html>
