<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cuckoo's Landing — Platform Overlay (2 pages: closed / open)</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 11in; height: 8.5in; page-break-after: always; }
  svg:last-child { page-break-after: auto; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>
<svg id="open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';

// Overlay sheet for the Cuckoo's Landing print map (cuckoos_landing_map.html).
// Base map: CELL=96, grid origin (96,96), gear center (576,576), R=480.
// Sheet transform: sheet_x = map_x - 48, sheet_y = map_y - 16.
// Platform footprint: A1-A10 (full north row) + corner blocks B1-B2, B9-B10.
// Cut along the bold outline. Lay on the map so the platform covers row A;
// the gear sheet rotates freely beneath it. The rod/perch (open page) reaches
// the gear hub: perch center = map (576,576) = sheet (528,560).
const SX = x => x - 48, SY = y => y - 16;
const CELL = 96, INK = '#000';

// Sheet-space landmarks (all derived from map coords, checked below)
const PX0 = SX(96),  PX1 = SX(1056);          // platform west/east = 48 / 1008
const PAY0 = SY(96), PAY1 = SY(192);          // row A top/bottom  = 80 / 176
const PBY1 = SY(288);                          // row B bottom      = 272
const WBX0 = SX(288), EBX0 = SX(864);          // corner block inner edges = 240 / 816
const WALL0 = PAY0 - 40;                       // wall band top = 40
const DX0 = SX(480), DX1 = SX(672);            // door aperture (2 squares centered) = 432 / 624
const RODX = SX(576);                          // rod centerline = 528
const HUB = [SX(576), SY(576)];                // perch center = (528, 560)

console.log('platform', PX0, PX1, PAY0, PAY1, PBY1, 'door', DX0, DX1, 'hub', HUB);

function build(svg, open) {
  function el(name, attrs = {}, parent = svg) {
    const n = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  }
  function txt(x, y, str, attrs = {}) {
    const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs));
    t.textContent = str;
    return t;
  }

  const defs = el('defs');
  const wallPat = el('pattern', { id: (open ? 'o' : 'c') + 'wall', width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M0 7 L7 0', stroke: INK, 'stroke-width': 0.4, fill: 'none' }, wallPat);
  const voidPat = el('pattern', { id: (open ? 'o' : 'c') + 'void', width: 5, height: 5, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: 'M0 5 L5 0 M0 0 L5 5', stroke: INK, 'stroke-width': 0.4, fill: 'none' }, voidPat);

  el('rect', { x: 0, y: 0, width: 1056, height: 816, fill: '#fff' });

  // --- Cut shape: wall band + platform with corner blocks (bold outline) ---
  const outline = `M ${PX0} ${WALL0} H ${PX1} V ${PBY1} H ${EBX0} V ${PAY1} H ${WBX0} V ${PBY1} H ${PX0} Z`;
  el('path', { d: outline, fill: '#fff', stroke: INK, 'stroke-width': 4 });

  // --- Interior grid (thin, matches base map) ---
  for (let c = 0; c <= 10; c++) {
    const x = PX0 + c * CELL;
    const yEnd = (x <= WBX0 || x >= EBX0) ? PBY1 : PAY1;
    el('line', { x1: x, y1: PAY0, x2: x, y2: yEnd, stroke: INK, 'stroke-width': 1 });
  }
  el('line', { x1: PX0, y1: PAY1, x2: PX1, y2: PAY1, stroke: INK, 'stroke-width': 1 });
  el('line', { x1: PX0, y1: PBY1, x2: WBX0, y2: PBY1, stroke: INK, 'stroke-width': 1 });
  el('line', { x1: EBX0, y1: PBY1, x2: PX1, y2: PBY1, stroke: INK, 'stroke-width': 1 });

  // --- Wall band (hatched), interrupted by the door aperture ---
  for (const [x0, x1] of [[PX0, DX0], [DX1, PX1]]) {
    el('rect', { x: x0, y: WALL0, width: x1 - x0, height: PAY0 - WALL0, fill: `url(#${open ? 'o' : 'c'}wall)`, stroke: 'none' });
    el('line', { x1: x0, y1: PAY0, x2: x1, y2: PAY0, stroke: INK, 'stroke-width': 1.5 });
  }

  // --- Planar door: frame + leaves ---
  el('rect', { x: DX0 - 6, y: WALL0, width: (DX1 - DX0) + 12, height: (PAY0 - WALL0) + 8, fill: '#fff', stroke: INK, 'stroke-width': 2.5 });
  if (!open) {
    // Closed: two leaves meeting at a center seam, ring handles, hinge ticks
    for (const [lx0, lx1] of [[DX0, RODX], [RODX, DX1]]) {
      el('rect', { x: lx0, y: WALL0 + 5, width: lx1 - lx0, height: (PAY0 - WALL0) - 2, fill: '#fff', stroke: INK, 'stroke-width': 1.5 });
    }
    el('line', { x1: RODX, y1: WALL0 + 5, x2: RODX, y2: PAY0 + 3, stroke: INK, 'stroke-width': 2 });
    for (const hx of [RODX - 11, RODX + 11]) {
      el('circle', { cx: hx, cy: WALL0 + 22, r: 5, fill: 'none', stroke: INK, 'stroke-width': 1.3 });
    }
    for (const hx of [DX0 + 4, DX1 - 4]) {
      el('line', { x1: hx, y1: WALL0 + 8, x2: hx, y2: WALL0 + 16, stroke: INK, 'stroke-width': 2 });
      el('line', { x1: hx, y1: PAY0 - 10, x2: hx, y2: PAY0 - 2, stroke: INK, 'stroke-width': 2 });
    }
  } else {
    // Open: aperture void, leaves swung onto the platform, dashed swing arcs
    el('rect', { x: DX0, y: WALL0 + 4, width: DX1 - DX0, height: (PAY0 - WALL0), fill: `url(#ovoid)`, stroke: INK, 'stroke-width': 1.5 });
    for (const [hx, dir] of [[DX0 + 4, 1], [DX1 - 4, -1]]) {
      el('rect', { x: hx - (dir > 0 ? 0 : 16), y: PAY0, width: 16, height: 88, fill: '#fff', stroke: INK, 'stroke-width': 1.5 });
      el('path', { d: `M ${hx + dir * 88} ${PAY0} A 88 88 0 0 ${dir > 0 ? 1 : 0} ${hx} ${PAY0 + 88}`, fill: 'none', stroke: INK, 'stroke-width': 0.8, 'stroke-dasharray': '5 4' });
    }
  }

  // --- Hatch up from the Bellows Chamber (trapdoor, B2) ---
  const hx0 = SX(192) + 8, hy0 = SY(192) + 8, hs = CELL - 16;   // inset square in B2
  el('rect', { x: hx0, y: hy0, width: hs, height: hs, fill: '#fff', stroke: INK, 'stroke-width': 2.5 });
  el('rect', { x: hx0 + 7, y: hy0 + 7, width: hs - 14, height: hs - 14, fill: 'none', stroke: INK, 'stroke-width': 1 });
  for (let i = 1; i <= 4; i++) {
    el('line', { x1: hx0 + 12, y1: hy0 + 7 + i * (hs - 14) / 5, x2: hx0 + hs - 12, y2: hy0 + 7 + i * (hs - 14) / 5, stroke: INK, 'stroke-width': 1.5 });
  }
  for (const ty of [hy0 + 14, hy0 + hs - 14]) {
    el('line', { x1: hx0 - 5, y1: ty, x2: hx0 + 4, y2: ty, stroke: INK, 'stroke-width': 2.5 });
  }

  // --- Air riser (B1) + manifold + twin pipes into the door's west jamb ---
  const RX = SX(144), RYB = SY(240);      // riser through-deck at B1 center
  el('circle', { cx: RX, cy: RYB, r: 12, fill: '#fff', stroke: INK, 'stroke-width': 2 });
  el('circle', { cx: RX, cy: RYB, r: 6, fill: 'none', stroke: INK, 'stroke-width': 1 });
  // white underlays so runs read in front of grid/wall hatch
  el('rect', { x: RX - 9, y: WALL0 + 36, width: 18, height: RYB - 14 - (WALL0 + 36), fill: '#fff', stroke: 'none' });
  el('rect', { x: RX - 16, y: WALL0 + 2, width: DX0 - 6 - (RX - 16), height: 34, fill: '#fff', stroke: 'none' });
  // vertical riser run (dashed pair) up to a small wall manifold
  for (const dx of [-7, 7]) {
    el('line', { x1: RX + dx, y1: RYB - 14, x2: RX + dx, y2: WALL0 + 36, stroke: INK, 'stroke-width': 1.3, 'stroke-dasharray': '6 4' });
  }
  el('rect', { x: RX - 15, y: WALL0 + 4, width: 30, height: 32, rx: 3, fill: '#fff', stroke: INK, 'stroke-width': 2 });
  el('circle', { cx: RX, cy: WALL0 + 20, r: 5, fill: 'none', stroke: INK, 'stroke-width': 1 });
  // twin horizontal runs from manifold east to the door jamb
  for (const cy of [WALL0 + 12, WALL0 + 28]) {
    for (const dy of [-4.5, 4.5]) {
      el('line', { x1: RX + 15, y1: cy + dy, x2: DX0 - 6, y2: cy + dy, stroke: INK, 'stroke-width': 1.3, 'stroke-dasharray': '6 4' });
    }
    el('line', { x1: DX0 - 10, y1: cy - 8, x2: DX0 - 10, y2: cy + 8, stroke: INK, 'stroke-width': 2.5 });  // jamb flange
  }

  // --- Open page: telescoping rod + cuckoo perch at the gear hub ---
  if (open) {
    const segs = [[18, PAY0, SY(336)], [13, SY(336), SY(480)], [9, SY(480), HUB[1] - 44]];
    for (const [hw, y0, y1] of segs) {
      el('rect', { x: RODX - hw, y: y0, width: 2 * hw, height: y1 - y0, fill: '#fff', stroke: INK, 'stroke-width': 2.5 });
    }
    for (const [hw, y0] of [[18, SY(336)], [13, SY(480)]]) {
      el('rect', { x: RODX - hw - 4, y: y0 - 5, width: 2 * (hw + 4), height: 10, fill: '#fff', stroke: INK, 'stroke-width': 1.5 });
    }
    // perch disc: bold rim, inner ring, centered exactly on the gear hub
    el('circle', { cx: HUB[0], cy: HUB[1], r: 52, fill: '#fff', stroke: INK, 'stroke-width': 4 });
    el('circle', { cx: HUB[0], cy: HUB[1], r: 40, fill: 'none', stroke: INK, 'stroke-width': 1.5 });
    el('circle', { cx: HUB[0], cy: HUB[1], r: 8, fill: 'none', stroke: INK, 'stroke-width': 1.5 });
    console.log('rod segs', JSON.stringify(segs), 'disc r52 at', HUB);
  }

  // --- Sheet caption (outside the cut shape; trim off) ---
  txt(528, 790, `CUCKOO'S LANDING — PLATFORM OVERLAY (${open ? 'OPEN' : 'CLOSED'}) · cut along bold outline · align over row A`, { fill: INK, 'font-size': 13, 'letter-spacing': 1 });
}

build(document.getElementById('closed'), false);
build(document.getElementById('open'), true);
</script>

</body>
</html>
