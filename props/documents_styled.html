<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styled Documents — print sheet (no labels)</title>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .page {
    width: 8.5in; height: 11in; box-sizing: border-box; padding: 0.2in;
    page-break-after: always;
    display: flex; align-items: center; justify-content: center;
  }
  .page img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="page"><img src="../images/letter.png"></div>
<div class="page"><img src="../images/journal1.png"></div>
<div class="page"><img src="../images/journal2.png"></div>
<div class="page"><img src="../images/manifest.png"></div>
</body>
</html>
