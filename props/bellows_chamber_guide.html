<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bellows Chamber — DM Reference (letter landscape)</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; width: 11in; height: 8.5in; }
  text { font-family: 'Liberation Mono', monospace; }
</style>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 816"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
function el(name, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function txt(x, y, str, attrs = {}, parent = svg) {
  const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs), parent);
  t.textContent = str;
  return t;
}

// Bellows Chamber at 42px/square with DM overlays. Geometry mirrors the print
// map exactly via g()/gy() (print map: OX 240, OY 96, CELL 96).
const CELL = 42, COLSN = 12;
const ROWS = "ABCDEFGHI";
const OX = 40, OY = 150;
const S = CELL / 96;
const g  = x => x * S + (OX - 240 * S);
const gy = y => y * S + (OY - 96 * S);
const W = COLSN * CELL, H = ROWS.length * CELL;
const INK = '#000';
function cxy(col, row) { return [OX + (col - 1) * CELL, OY + ROWS.indexOf(row) * CELL]; }

const defs = el('defs');
const pat = el('pattern', { id: 'mach', width: 5, height: 5, patternUnits: 'userSpaceOnUse' }, defs);
el('path', { d: 'M0 5 L5 0', stroke: INK, 'stroke-width': 0.5, fill: 'none' }, pat);
const pat2 = el('pattern', { id: 'diff', width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
el('path', { d: 'M0 7 L7 0', stroke: INK, 'stroke-width': 0.35, fill: 'none' }, pat2);

el('rect', { x: 0, y: 0, width: 1056, height: 816, fill: '#fff' });

const blocked = new Set(["A1", "A2", "A11", "A12", "I1", "I2", "I11", "I12"]);
for (let r = 0; r < ROWS.length; r++) {
  for (let c = 1; c <= COLSN; c++) {
    const cell = ROWS[r] + c;
    const x = OX + (c - 1) * CELL, y = OY + r * CELL;
    el('rect', { x, y, width: CELL, height: CELL,
                 fill: blocked.has(cell) ? 'url(#mach)' : '#fff',
                 stroke: INK, 'stroke-width': blocked.has(cell) ? 0.4 : 0.5 });
  }
}

// --- Difficult terrain overlay (authoritative junk squares) ---
const DIFF = ["A3","A4","A5","A6","A8","A9","A10","B5","B10",
              "D3","D4","D5","D8","D10","E3","E4","E5","E6","E7","E8","E9",
              "F1","F2","F3","F5","F6","F7","F9","F10","F11","F12",
              "G3","G8","H2","H3","H8","H11","H12","I4","I9","I10"];
for (const sq of DIFF) {
  const col = parseInt(sq.slice(1)), row = sq[0];
  const [x, y] = cxy(col, row);
  el('rect', { x: x + 1, y: y + 1, width: CELL - 2, height: CELL - 2, fill: 'url(#diff)', stroke: 'none' });
}

// --- Bellows (flush levers) ---
function bellowsG(x, y, w, h) {
  const bx = x + 4, by = y + 5, bw = w - 8, bh = h - 10;
  el('rect', { x: bx, y: by, width: bw, height: bh, rx: 15, fill: '#fff', stroke: INK, 'stroke-width': 1.6 });
  for (let i = 1; i <= 5; i++) {
    el('line', { x1: bx + 5, y1: by + (bh * i) / 6, x2: bx + bw - 5, y2: by + (bh * i) / 6, stroke: INK, 'stroke-width': 0.5 });
  }
}
const [wbx, wby] = cxy(1, "B");
bellowsG(wbx, wby, 2 * CELL, 4 * CELL);
txt(wbx + CELL, wby + 2 * CELL, "BELLOWS", { fill: INK, 'font-size': 9, 'font-weight': 700 });
txt(wbx + CELL, wby + 2 * CELL + 12, "flush lever", { fill: INK, 'font-size': 7.5 });
const [ebx, eby] = cxy(11, "B");
bellowsG(ebx, eby, 2 * CELL, 4 * CELL);
txt(ebx + CELL, eby + 2 * CELL, "BELLOWS", { fill: INK, 'font-size': 9, 'font-weight': 700 });
txt(ebx + CELL, eby + 2 * CELL + 12, "flush lever", { fill: INK, 'font-size': 7.5 });

// --- Overhead ducts (exact print-map routes, scaled) ---
function duct(pts) {
  let d = '';
  pts.forEach(([x, y], i) => { d += (i ? ' L ' : 'M ') + g(x).toFixed(1) + ' ' + gy(y).toFixed(1); });
  el('path', { d, fill: 'none', stroke: INK, 'stroke-width': 0.9, 'stroke-dasharray': '4 3' });
}
duct([[371, 232], [371, 264], [480, 264], [480, 312], [786, 312]]);                        // west duct
duct([[1261, 232], [1261, 168], [1152, 168], [1152, 360], [840, 360], [840, 318]]);        // east duct
duct([[480, 324], [480, 396]]);                                                            // west stub
duct([[1152, 372], [1152, 396]]);                                                          // east stub
for (const [sx, sy] of [[480, 400], [1152, 400]]) {                                        // open mouths
  el('ellipse', { cx: g(sx), cy: gy(sy), rx: 3, ry: 1.3, fill: 'none', stroke: INK, 'stroke-width': 0.9 });
}
el('circle', { cx: g(1152), cy: gy(300), r: 4.5, fill: '#fff', stroke: INK, 'stroke-width': 0.9 });  // gauge

// fallen caps (the clue)
for (const [cx2, cy2] of [[462, 430], [1178, 462]]) {
  el('circle', { cx: g(cx2), cy: gy(cy2), r: 4, fill: '#fff', stroke: INK, 'stroke-width': 1 });
  el('circle', { cx: g(cx2), cy: gy(cy2), r: 2, fill: 'none', stroke: INK, 'stroke-width': 0.6 });
}
txt(g(480) - 16, gy(400) + 4, "stub", { fill: INK, 'font-size': 7.5, 'font-weight': 700 });
txt(g(1152) + 17, gy(400) + 4, "stub", { fill: INK, 'font-size': 7.5, 'font-weight': 700 });
txt(g(480) - 5, gy(448), "SW1", { fill: INK, 'font-size': 8, 'font-weight': 700 });
txt(g(1152) - 14, gy(448), "SW2", { fill: INK, 'font-size': 8, 'font-weight': 700 });

// --- Manifold on the B/C-6/7 intersection + ladder on the left of C6 ---
el('rect', { x: g(788), y: gy(260), width: 56 * S, height: 56 * S, rx: 3.5, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
el('circle', { cx: g(816), cy: gy(288), r: 6, fill: '#fff', stroke: INK, 'stroke-width': 1.3 });
el('circle', { cx: g(816), cy: gy(288), r: 3, fill: 'none', stroke: INK, 'stroke-width': 0.8 });
for (const rx of [g(726), g(758)]) {
  el('line', { x1: rx, y1: gy(294), x2: rx, y2: gy(378), stroke: INK, 'stroke-width': 1.3 });
}
for (let i = 0; i < 5; i++) {
  el('line', { x1: g(726), y1: gy(304 + i * 15), x2: g(758), y2: gy(304 + i * 15), stroke: INK, 'stroke-width': 0.9 });
}
txt(g(742), gy(378) + 11, "ladder up (Cuckoo's Landing)", { fill: INK, 'font-size': 7.5 });

// --- Six stirge perches (wave 1), hanging from the ducts ---
for (const [px, py] of [[420, 264], [600, 312], [700, 312], [1152, 240], [1261, 200], [1000, 360]]) {
  el('circle', { cx: g(px), cy: gy(py), r: 8, fill: '#fff', stroke: INK, 'stroke-width': 1.1, 'stroke-dasharray': '3 2' });
  txt(g(px), gy(py) + 3.5, "s", { fill: INK, 'font-size': 10, 'font-weight': 700 });
}

// --- Workbench (journal) and modron crate ---
el('rect', { x: g(536), y: gy(110), width: 176 * S, height: 68 * S, rx: 2, fill: '#fff', stroke: INK, 'stroke-width': 1.2 });
txt(g(624), gy(144) + 3, "BENCH", { fill: INK, 'font-size': 7.5 });
txt(g(686), gy(134) + 3, "J", { fill: INK, 'font-size': 11, 'font-weight': 700 });
el('rect', { x: g(916), y: gy(100), width: 88 * S, height: 88 * S, fill: '#fff', stroke: INK, 'stroke-width': 1.4 });
el('circle', { cx: g(960), cy: gy(144), r: 4.5, fill: 'none', stroke: INK, 'stroke-width': 0.8 });
txt(g(960), gy(188) + 10, "CRATE", { fill: INK, 'font-size': 6.5 });

// --- The Gear (hidden behind the east bellows) ---
const [gx2, gy2] = cxy(12, "F");
el('circle', { cx: gx2 + CELL/2, cy: gy2 + CELL/2, r: 11, fill: 'none', stroke: INK, 'stroke-width': 1.8 });
el('circle', { cx: gx2 + CELL/2, cy: gy2 + CELL/2, r: 4, fill: 'none', stroke: INK, 'stroke-width': 0.9 });
txt(gx2 + CELL/2, gy2 + CELL - 2, "GEAR", { fill: INK, 'font-size': 7.5, 'font-weight': 700 });

// --- Stairs ---
const [sx2, sy2] = cxy(6, "I");
for (let i = 1; i <= 4; i++) {
  el('line', { x1: sx2 + 8, y1: sy2 + i * (CELL/5), x2: sx2 + 2*CELL - 8, y2: sy2 + i * (CELL/5), stroke: INK, 'stroke-width': 0.9 });
}
txt(sx2 + CELL, sy2 - 5, "stairs down (Clockhall)", { fill: INK, 'font-size': 8 });

el('rect', { x: OX, y: OY, width: W, height: H, fill: 'none', stroke: INK, 'stroke-width': 2.5 });
for (let c = 1; c <= COLSN; c++) txt(OX + (c-1)*CELL + CELL/2, OY + H + 16, String(c), { fill: INK, 'font-size': 9 });
for (let r = 0; r < ROWS.length; r++) txt(OX - 14, OY + r*CELL + CELL/2 + 3, ROWS[r], { fill: INK, 'font-size': 9 });

// ============ RIGHT PANEL ============
const PX = 580;
txt((PX + 1020) / 2, 52, "BELLOWS CHAMBER — DM REFERENCE", { fill: INK, 'font-size': 20, 'font-weight': 700, 'letter-spacing': 2 });
txt((PX + 1020) / 2, 78, "Hard · ~2,100 adjusted XP for 8 lvl-3 PCs · target 3 rounds",
  { fill: INK, 'font-size': 11.5 });

let ty = 108;
function section(title) {
  txt(PX, ty, title, { fill: INK, 'font-size': 12, 'font-weight': 700, 'text-anchor': 'start', 'letter-spacing': 1 });
  el('line', { x1: PX, y1: ty + 6, x2: 1020, y2: ty + 6, stroke: INK, 'stroke-width': 1 });
  ty += 22;
}
function lines(arr) {
  for (const line of arr) { txt(PX, ty, line, { fill: INK, 'font-size': 11, 'text-anchor': 'start' }); ty += 17; }
  ty += 12;
}
section("WAVES");
lines([
  "1  on entry            6 stirges hanging from the overhead ducts",
  "2  a bellows worked    swarm FLUSHED out of that duct's stub (SW1/SW2)",
  "3  other bellows       second swarm, other stub — they see it coming",
]);
section("ENEMIES");
lines([
  "Stirge x6 (CR 1/8): AC 13, HP 5, fly 40. +5, 1d6+3 pierce + ATTACH",
  "  (2d4 necrotic at start of its turn; action within 5 ft to detach).",
  "Swarm of Stirges x2 (CR 2): AC 14, HP 36, fly 40. +5, 2d10+3 pierce",
  "  (1d10+3 when bloodied). RESISTS B/P/S. Occupies creatures' space:",
  "  Medium- targets in swarm grappled (esc DC 13), 2d6 necrotic at end",
  "  of their turn. Immune: charm/fright/grapple/prone/restrain/stun.",
]);
section("ROOM & NOTES");
lines([
  "Light-hatched squares = junk = DIFFICULT TERRAIN. Bench and crates",
  "  can be clambered over (also difficult). Bellows: impassable,",
  "  climbable, half cover behind.",
  "STUBS: both service stubs are UNCAPPED (Perception DC 15, or spot",
  "  the fallen caps on the floor beside each). The stirges moved into",
  "  the ducts through them; the swarms nest in the pipes (~1.5 ft bore).",
  "Working a bellows = an action; blasts its duct, flushing its swarm.",
  "RESTORE THE AIR: work both bellows + re-cap BOTH stubs -> enables",
  "  the cuckoo's call in Act III (bellows are lungs, cuckoo the mouth).",
  "GEAR: wedged behind the east bellows (F12) — visible once cleared.",
  "Journal on the workbench (page visible, A5) = entry-3, The",
  "  Disconnection. Modron crate (A8) matches the delivery manifest.",
  "Exit up: ladder at C6 beside the main riser. Individuals die in one",
  "  hit; swarms halve martial damage — AoE and magic shine.",
  "Too easy: survivors re-emerge. Too hard: swarm at half HP flees.",
]);
</script>

</body>
</html>
