<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cuckoo's Landing — Battle Map (18×24 in, 1 in = 5 ft)</title>
<style>
  @font-face { font-family: 'EB Garamond'; src: url('ebgaramond-regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'EB Garamond'; src: url('ebgaramond-bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'EB Garamond'; src: url('ebgaramond-italic.ttf'); font-style: italic; }
  @page { size: 18in 24in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #1a1a2e; }
  svg { display: block; width: 18in; height: 24in; }
  text { font-family: 'EB Garamond', serif; }
</style>
</head>
<body>

<svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 2304"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');

function el(name, attrs = {}, parent = svg) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
}
function txt(x, y, str, attrs = {}, parent = svg) {
  const t = el('text', Object.assign({ x, y, 'text-anchor': 'middle' }, attrs), parent);
  t.textContent = str;
  return t;
}

// 1 in = 5 ft = 96 SVG units (CSS px). Page: 18×24 in = 1728×2304.
const CELL = 96;
const COLS = 10, ROWS = 10;
const PAGE_W = 1728, PAGE_H = 2304;
const W = COLS * CELL, H = ROWS * CELL;
const OX = (PAGE_W - W) / 2;
const OY = 540;
const CX = OX + W / 2, CY = OY + H / 2, R = W / 2;

// --- Geometry (in 5 ft units) ---
// Any part of cell overlaps the gear circle
function inGear(col, row) {
  const cL = col * 5, cT = row * 5, cR = cL + 5, cB = cT + 5;
  const px = Math.max(cL, Math.min(25, cR));
  const py = Math.max(cT, Math.min(25, cB));
  return Math.hypot(px - 25, py - 25) <= 25;
}
// Cone: includes edge cells where the cone angle clips through
function inCone(col, row) {
  if (row <= 5) return false;
  const dist = row - 5;
  if (dist > 6) return false;
  return col >= 4 - dist && col <= 5 + dist;
}
function cellType(col, row) {
  if (row >= 4 && row <= 5 && col >= 4 && col <= 5) return 'cuckoo';
  if (row <= 3 && col >= 4 && col <= 5 && inGear(col, row)) return 'impact';
  if (inCone(col, row) && inGear(col, row)) return 'cone';
  if (inGear(col, row)) return 'floor';
  return 'off';
}
const COLORS = {
  floor:  'rgba(42, 42, 62, 0.9)',
  cuckoo: 'rgba(139, 69, 20, 0.8)',
  impact: 'rgba(255, 80, 80, 0.22)',
  cone:   'rgba(100, 180, 255, 0.20)',
};

// --- Background ---
el('rect', { x: 0, y: 0, width: PAGE_W, height: PAGE_H, fill: '#1a1a2e' });

// --- Title ---
txt(CX, 150, "CUCKOO'S LANDING", { fill: '#c8a86e', 'font-size': 72, 'font-weight': 700, 'letter-spacing': 10 });
txt(CX, 210, 'Battlefield Grid — 25 ft radius gear · 5 ft squares · all partial edge squares included',
  { fill: '#888', 'font-size': 28 });

// --- Cells + grid, clipped to the gear circle ---
const defs = el('defs');
const clip = el('clipPath', { id: 'gearClip' }, defs);
el('circle', { cx: CX, cy: CY, r: R }, clip);
const gClipped = el('g', { 'clip-path': 'url(#gearClip)' });

for (let row = 0; row < ROWS; row++) {
  for (let col = 0; col < COLS; col++) {
    const type = cellType(col, row);
    if (type === 'off') continue;
    el('rect', { x: OX + col * CELL, y: OY + row * CELL, width: CELL, height: CELL, fill: COLORS[type] }, gClipped);
  }
}
for (let i = 0; i <= COLS; i++) {
  el('line', { x1: OX + i * CELL, y1: OY, x2: OX + i * CELL, y2: OY + H,
    stroke: 'rgba(200,168,110,0.18)', 'stroke-width': 2 }, gClipped);
}
for (let i = 0; i <= ROWS; i++) {
  el('line', { x1: OX, y1: OY + i * CELL, x2: OX + W, y2: OY + i * CELL,
    stroke: 'rgba(200,168,110,0.18)', 'stroke-width': 2 }, gClipped);
}
// Rod grid line highlight
el('line', { x1: OX + 5 * CELL, y1: OY, x2: OX + 5 * CELL, y2: OY + H,
  stroke: 'rgba(200,168,110,0.35)', 'stroke-width': 4 }, gClipped);

// --- Gear border + teeth ---
el('circle', { cx: CX, cy: CY, r: R, fill: 'none', stroke: '#c8a86e', 'stroke-width': 6 });
const numTeeth = 32;
for (let i = 0; i < numTeeth; i++) {
  const a = (i / numTeeth) * 360;
  const rad = a * Math.PI / 180;
  const tx = CX + Math.cos(rad) * R, ty = CY + Math.sin(rad) * R;
  el('path', { d: 'M -23.5 0 L -15 -45 L 15 -45 L 23.5 0 Z', fill: '#c8a86e',
    transform: `translate(${tx} ${ty}) rotate(${a + 90})` });
}

// --- Rod ---
const rodX = OX + 5 * CELL;
const rodTopY = CY - R + 20;
const rodBotY = OY + 4 * CELL;
el('rect', { x: rodX - 6, y: rodTopY, width: 12, height: rodBotY - rodTopY,
  fill: '#aaa', stroke: '#777', 'stroke-width': 2 });

// --- Planar aperture ---
const apW = CELL * 2 + 20, apH = 42;
const apX = CX - apW / 2, apY = CY - R - apH + 4;
el('rect', { x: apX - 4, y: apY - 4, width: apW + 8, height: apH + 8,
  fill: 'none', stroke: 'rgba(155,89,178,0.35)', 'stroke-width': 10, rx: 4 });
el('rect', { x: apX, y: apY, width: apW, height: apH, fill: '#4a1a6e', stroke: '#9b59b6', 'stroke-width': 4 });

// --- Cone guide lines (dashed) ---
for (const dir of [-1, 1]) {
  el('line', {
    x1: OX + (5 + dir) * CELL, y1: OY + 6 * CELL,
    x2: OX + (5 + 5 * dir) * CELL, y2: OY + 10 * CELL,
    stroke: 'rgba(100,180,255,0.15)', 'stroke-width': 2, 'stroke-dasharray': '16 10' });
}

// --- Impact path borders (dashed) ---
for (const c of [4, 6]) {
  el('line', { x1: OX + c * CELL, y1: OY + 10, x2: OX + c * CELL, y2: OY + 4 * CELL,
    stroke: 'rgba(255,80,80,0.4)', 'stroke-width': 3, 'stroke-dasharray': '8 8' });
}

// --- Labels ---
txt(CX, apY - 24, 'TOWER WALL', { fill: '#888', 'font-size': 26, 'letter-spacing': 6 });
txt(CX, apY + apH / 2 + 8, 'PLANAR DOOR', { fill: '#d4aaff', 'font-size': 18, 'font-weight': 700, 'letter-spacing': 2 });

txt(CX, CY - 8, 'CUCKOO', { fill: '#c8a86e', 'font-size': 26, 'font-weight': 700, 'letter-spacing': 3 });
txt(CX, CY + 22, '10×10 ft', { fill: '#c8a86e', 'font-size': 20 });

txt(CX, OY + 1.5 * CELL - 6, 'IMPACT', { fill: 'rgba(255,80,80,0.75)', 'font-size': 20, 'font-weight': 700 });
txt(CX, OY + 1.5 * CELL + 20, 'PATH', { fill: 'rgba(255,80,80,0.75)', 'font-size': 20, 'font-weight': 700 });

txt(CX, OY + 7.3 * CELL, 'BELLOWS CONE', { fill: 'rgba(100,180,255,0.8)', 'font-size': 22, 'font-weight': 700, 'letter-spacing': 2 });
txt(CX, OY + 7.3 * CELL + 28, '30 ft · fixed direction', { fill: 'rgba(100,180,255,0.7)', 'font-size': 20 });

// --- Grid coordinates (numbers below, letters left) ---
for (let i = 0; i < COLS; i++) {
  txt(OX + i * CELL + CELL / 2, OY + H + 34, String(i + 1), { fill: 'rgba(200,168,110,0.5)', 'font-size': 22 });
}
for (let i = 0; i < ROWS; i++) {
  txt(OX - 22, OY + i * CELL + CELL / 2 + 8, String.fromCharCode(65 + i),
    { fill: 'rgba(200,168,110,0.5)', 'font-size': 22, 'text-anchor': 'end' });
}

// --- Scale bar ---
const sbX = OX + W + 44, sbY = OY + H - 60;
el('line', { x1: sbX, y1: sbY, x2: sbX + CELL, y2: sbY, stroke: 'rgba(200,168,110,0.5)', 'stroke-width': 3 });
el('line', { x1: sbX, y1: sbY - 8, x2: sbX, y2: sbY + 8, stroke: 'rgba(200,168,110,0.5)', 'stroke-width': 3 });
el('line', { x1: sbX + CELL, y1: sbY - 8, x2: sbX + CELL, y2: sbY + 8, stroke: 'rgba(200,168,110,0.5)', 'stroke-width': 3 });
txt(sbX + CELL / 2, sbY + 32, '5 ft = 1 in', { fill: 'rgba(200,168,110,0.5)', 'font-size': 20 });

// --- Rotation notes ---
txt(CX, OY + H + 100, 'Entire gear rotates 90° clockwise at Initiative 20',
  { fill: '#c8a86e', 'font-size': 28, 'font-weight': 700 });
txt(CX, OY + H + 140, 'Cone direction is fixed — rotation moves players into and out of the blast zone',
  { fill: 'rgba(200,168,110,0.55)', 'font-size': 24 });

// --- Legend ---
const LEGEND = [
  { fill: 'rgba(42,42,62,0.9)',    stroke: 'rgba(200,168,110,0.3)', label: 'Gear floor (5 ft square)' },
  { fill: 'rgba(139,69,20,0.8)',   stroke: 'rgba(200,168,110,0.3)', label: 'Cuckoo (10×10 ft, Large, restrained)' },
  { fill: 'rgba(255,80,80,0.25)',  stroke: 'rgba(255,80,80,0.5)',   label: 'Rod impact path (DEX save on emerge/retract)' },
  { fill: 'rgba(100,180,255,0.22)',stroke: 'rgba(100,180,255,0.5)', label: 'Bellows cone (DC 14 CON, on-rounds)' },
  { fill: '#aaa',                  stroke: '#777',                  label: 'Rod (on grid line, indestructible)' },
  { fill: '#4a1a6e',               stroke: '#9b59b6',               label: 'Planar aperture (blocked while cuckoo out)' },
];
const LY = OY + H + 220;
const legColX = [CX - 620, CX + 60];
LEGEND.forEach((item, i) => {
  const x = legColX[i % 2], y = LY + Math.floor(i / 2) * 68;
  el('rect', { x, y, width: 38, height: 38, rx: 6, fill: item.fill, stroke: item.stroke, 'stroke-width': 2 });
  txt(x + 56, y + 27, item.label, { fill: '#e0d8c0', 'font-size': 26, 'text-anchor': 'start' });
});

// --- Print note ---
txt(CX, PAGE_H - 70, 'Print at 100% scale — 18 × 24 in · 1 in = 5 ft', { fill: 'rgba(200,168,110,0.35)', 'font-size': 22 });
</script>

</body>
</html>
